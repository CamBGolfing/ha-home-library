# Standalone install (Raspberry Pi or any Docker host):
#   docker compose up -d --build
# then open http://<pi-address>:8099
services:
  home-library:
    build: ./home_library
    container_name: home-library
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - ./data:/data
    environment:
      - TZ=America/Chicago
      # - GOOGLE_BOOKS_API_KEY=
      # Optional: publish a Home Library device to an MQTT broker
      # - MQTT_HOST=192.168.1.10
      # - MQTT_USERNAME=library
      # - MQTT_PASSWORD=change-me
